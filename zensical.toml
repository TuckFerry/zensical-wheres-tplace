[project]
site_name = "这是哪里"
site_url = "https://blog.tuckferry.cn"
# site_description = "记录个人生活与学习历程，既包括已掌握和即将探索的知识，也包含日常生活中的点滴。"
site_author = "冷澀"

copyright = "充满回忆 | QQ <2494039263>"

repo_url = "https://github.com/TuckFerry"
repo_name = "TuckFerry - repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "首页" = "index.md" },
  { "音游" = [
    "rhythmgame/index.md",
  ]},
  { "关于" = [
    "about/updatelog.md",
  ]},
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
variant = "classic"  #界面主题
# custom_dir = "overrides"
favicon = "img/favicon.ico"
language = "zh"
features = [
  "announce.dismiss",
  # "content.action.edit",  #编辑源码
  # "content.action.view",  #查看源码
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",  #头部自动隐藏
  "navigation.expand",  #自动展开
  # "navigation.footer",  #底部导航
  "navigation.indexes",  #目录索引页（大标题可点击）
  "navigation.instant",  #即时加载
  "navigation.instant.prefetch",  #悬停预加载
  "navigation.instant.progress",  #加载进度条
  # "navigation.path",  #面包屑导航
  # "navigation.prune",  #性能优化
  "navigation.sections",  #展开第一层级
  "navigation.tabs",  #顶部导航标签页
  "navigation.tabs.sticky",  #固定顶部导航标签页
  "navigation.top",  #回到顶部按钮
  # "navigation.tracking",  #url跟踪
  "search.highlight",  #搜索高亮
  "toc.follow",  #右侧边栏自动滚动
  # "toc.integrate",  #右侧边栏渲染至左侧
]

logo = "img/sherii.webp"

[project.plugins.blog]
blog_dir = "rhythmgame"
blog_toc = true
post_date_format = "medium"
post_url_date_format = "yyyy/MM"
post_excerpt_max_authors = 0
post_excerpt_max_categories = 7
post_readtime = false
archive_name = "档案"
categories_name = "分类"
categories_allowed = ["Phigros", "Arcaea", "Rotaeno", "Maimai", "Chunithm", "In Falsus", "Others"]
authors = false

# [project.theme.icon]  #使用自带图标作为logo
# logo = "lucide/smile"

# [project.theme.font]  #字体
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]  #系统偏好
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换至浅色"

[[project.theme.palette]]  #浅色
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换至深色"
primary = "light blue"
accent = "indigo"

[[project.theme.palette]]  #深色
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切换至系统偏好"
primary = "blue grey"
accent = "indigo"

[[project.extra.social]]
icon = "simple/github"
link = "https://github.com/TuckFerry"

[[project.extra.social]]
icon = "simple/Bilibili"
link = "https://space.bilibili.com/513018531"

[project.markdown_extensions]  #markdown配置
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
